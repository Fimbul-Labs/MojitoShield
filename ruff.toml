# Style rules for all Python code in the project.
# Check with `ruff check` and format with `ruff format`, run from the project folder.

line-length = 99
target-version = "py310"  # The oldest Python on a supported Mint (Mint 21).

[lint]
select = [
    "E", "W",  # pycodestyle: PEP 8 layout
    "F",       # pyflakes: unused names, undefined names
    "I",       # isort: import order
    "UP",      # pyupgrade: modern syntax for the target version
    "B",       # bugbear: likely bugs
    "SIM",     # simpler equivalent code
    "BLE",     # catching every exception
    "RUF",     # ruff's own checks
    "D",       # pydocstyle: docstrings, in Google style (see below)
    "ANN",     # type hints on every function
]
ignore = [
    # The formatter keeps code within the line length. Only long text strings,
    # such as the messages in the text catalog, may go past it.
    "E501",
    # A class docstring describes how to create it, so __init__ needs none.
    "D107",
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# GTK code must call gi.require_version() before importing from gi.repository.
"src/bin/mojitoshield/app.py" = ["E402"]
# The launcher must set the import path before importing the app.
"src/bin/launcher.py" = ["E402"]
# In tests, the test names say what is tested; docstrings and hints are optional.
"src/bin/tests/*" = ["D", "ANN"]
